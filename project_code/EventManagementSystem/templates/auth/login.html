{% extends 'base.html' %}

{% block title %}Login - EventX{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Welcome Back</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary-color);">Sign Up</a>
    </p>
</div>
{% endblock %}
